# Check project-owned docs without reformatting inherited upstream manuals.
name: Markdown Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  markdown-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run MarkdownLint
        uses: DavidAnson/markdownlint-cli2-action@v18.0.0
        with:
          config: '.github/.markdownlint-cli2.jsonc'
          globs: "AGENTS.md,AI_PROJECT.md,UPSTREAM_BASELINE.md,docs/validation/**/*.md,docs/research/**/*.md"
          separator: ','

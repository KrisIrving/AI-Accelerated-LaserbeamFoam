name: Bootstrap shell checks (no OpenFOAM)

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/bootstrap-checks.yml'
      - 'applications/solvers/aiLaserbeamFoam/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/bootstrap-checks.yml'
      - 'applications/solvers/aiLaserbeamFoam/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Bash syntax (no compilation or simulation)
        run: |
          for script in scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Read-only audit fixture tests
        run: bash tests/test_audit_host.sh
      - name: Build preflight guards (no build)
        run: bash tests/test_build_preflight.sh
      - name: Independent solver source identity (no build)
        run: bash tests/test_ai_solver_source.sh
      - name: A/B preparation guards (no OpenFOAM)
        run: bash tests/test_prepare_preflight.sh
      - name: Input manifest order and locale regression (no OpenFOAM)
        run: bash tests/test_plate2d_inputs.sh
      - name: Generated Allrun preflight regression (mock utilities only)
        run: bash tests/test_plate2d_allrun.sh
      - name: ASCII comparison fixture tests (no OpenFOAM)
        run: python3 -m unittest discover -s tests -p 'test_compare*.py'
